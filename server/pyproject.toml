[project]
name = "hermes-app-plugin"
version = "0.1.0"
description = "Hermes plugin for the Hermes Android app"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "fastapi==0.133.1",
]

[dependency-groups]
dev = [
    "pytest",
    "http-ece==1.2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
